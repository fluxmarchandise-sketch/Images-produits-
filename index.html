<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4a07b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png" type="image/png">
<title>صور المنتجات</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f3f0;color:#222;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.app{max-width:820px;margin:auto;padding:16px 14px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 18px}
h1{margin:0;font-size:28px}
header p{margin:4px 0 0;color:#777}
.card{background:#fff;border-radius:22px;padding:17px;margin-bottom:15px;box-shadow:0 5px 24px #0000000d}
label{display:block;font-weight:800;margin-bottom:8px}
.search{display:grid;grid-template-columns:1fr auto auto;gap:8px}
input{font:inherit;min-width:0;padding:13px;border:1px solid #ddd;border-radius:13px;outline:0}
button{font:inherit;font-weight:750;border:0;border-radius:13px;padding:12px 15px;cursor:pointer}
.primary{background:#f2a07d;color:#25140d}
.secondary{background:#eee9e6;color:#333}
.danger{background:#b83d3d;color:#fff}
.msg{min-height:21px;margin-top:9px;color:#777;font-size:14px}
.scanner{position:relative;background:#111;border-radius:18px;overflow:hidden;margin-top:12px}
.scanner video{display:block;width:100%;max-height:360px}
.guide{position:absolute;left:12%;right:12%;top:50%;border-top:2px solid #f2a07d;box-shadow:0 0 12px #f2a07d}
.scanner .danger{position:absolute;top:10px;right:10px}
.scan-msg{color:#fff;padding:9px;text-align:center}
.hidden{display:none!important}
.product-title small{color:#777;font-weight:800}
.product-title h2{font-size:25px;margin:4px 0}
.product-title code{color:#777}
.photo-box{min-height:300px;margin-top:15px;border-radius:18px;background:#f1eeec;display:flex;align-items:center;justify-content:center;overflow:hidden}
.photo-box img{width:100%;max-height:560px;object-fit:contain}
.no-photo{display:flex;flex-direction:column;align-items:center;gap:8px;color:#777;text-align:center;padding:25px}
.no-photo span{font-size:52px}
.buttons,.edit{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.buttons button,.edit button{flex:1;min-width:145px}
.edit{border-top:1px solid #eee;padding-top:12px}
.hint{font-size:13px;color:#777;margin-top:9px}
.modal{position:fixed;inset:0;background:#000b;z-index:20;display:flex;align-items:center;justify-content:center;padding:12px}
.modal-card{background:#fff;border-radius:20px;padding:12px;width:min(720px,100%)}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.modal-head button{font-size:25px;padding:1px 10px;background:#eee}
.modal video{width:100%;max-height:72vh;background:#111;border-radius:15px}
.shot{display:block;width:72px;height:72px;border-radius:50%;margin:12px auto 2px;background:#f2a07d;border:7px solid #eee;font-size:0}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:12px 16px;border-radius:12px;opacity:0;transition:.2s;z-index:50;white-space:nowrap}
.toast.show{opacity:1}
@media(max-width:650px){
 .search{grid-template-columns:1fr 1fr}
 .search input{grid-column:1/-1}
 h1{font-size:24px}
}
</style>
</head>

<body>
<div class="app">

<header>
  <div>
    <h1>صور المنتجات</h1>
    <p>الكود ← الاسم ← الصورة</p>
  </div>
</header>

<section class="card">
  <label for="code">كود المنتوج</label>

  <div class="search">
    <input id="code" inputmode="numeric" autocomplete="off" placeholder="أدخل أو امسح الكود">
    <button id="scan" class="primary">📷 Scan</button>
    <button id="find" class="secondary">بحث</button>
  </div>

  <div id="scanner" class="scanner hidden">
    <video id="scanVideo" playsinline></video>
    <div class="guide"></div>
    <button id="stopScan" class="danger">إيقاف</button>
    <div id="scanMsg" class="scan-msg">وجّه الكاميرا نحو الباركود</div>
  </div>

  <div id="msg" class="msg"></div>
</section>

<section id="product" class="card hidden">

  <div class="product-title">
    <small>اسم المنتوج</small>
    <h2 id="name">—</h2>
    <code id="shownCode"></code>
  </div>

  <div class="photo-box">
    <img id="photo" class="hidden" alt="صورة المنتوج">
    <div id="noPhoto" class="no-photo">
      <span>📦</span>
      <b>لا توجد صورة بعد</b>
      <small>يمكنك تصوير المنتوج أو اختيار صورة من الهاتف</small>
    </div>
  </div>

  <div class="buttons">
    <button id="take" class="primary">📷 تصوير</button>
    <button id="choose" class="secondary">🖼️ من الهاتف</button>
    <input id="file" type="file" accept="image/*" hidden>
  </div>

  <div id="edit" class="edit hidden">
    <button id="rotate" class="secondary">↻ تدوير</button>
    <button id="restore" class="secondary">↺ الأصل</button>
    <button id="save" class="primary">☁️ حفظ في Drive</button>
  </div>

  <div id="drive" class="hint"></div>
</section>

</div>

<div id="camera" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <b>تصوير المنتوج</b>
      <button id="closeCamera">×</button>
    </div>
    <video id="cameraVideo" autoplay playsinline></video>
    <canvas id="canvas" hidden></canvas>
    <button id="shot" class="shot">●</button>
  </div>
</div>

<!--
  غيّر فقط هذا الرابط بعد إنشاء Google Apps Script Web App.
-->
<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyk67qh-UM5Cv1LrHvysWn4X0loEoRBpU-wVG7qS02c6KLb_gYv7wba3CJOf6MXX8O8/exec";
const APP_VERSION = "2026-09-11-v2";

let currentCode="";
let currentImage="";
let originalImage="";
let rotation=0;
let cameraStream=null;
let scanStream=null;

const $=id=>document.getElementById(id);

function toast(text){
  const e=$("toast") || document.createElement("div");
  if(!e.id){e.id="toast";e.className="toast";document.body.appendChild(e)}
  e.textContent=text;
  e.classList.add("show");
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>e.classList.remove("show"),2600);
}

function message(text){$("msg").textContent=text}

function validURL(){
  if(!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes("PUT_YOUR")){
    toast("ضع رابط Google Apps Script داخل الملف أولاً");
    return false;
  }
  return true;
}

/*
  JSONP:
  نستخدمه للبحث حتى لا تكون هناك مشكلة CORS
  عند استدعاء Google Apps Script من PWA.
*/
function jsonp(url){
  return new Promise((resolve,reject)=>{
    const cb="productCallback_"+Date.now()+"_"+Math.random().toString(36).slice(2);
    const script=document.createElement("script");
    let finished=false;

    function cleanup(){
      clearTimeout(timer);
      try{ delete window[cb]; }catch(e){ window[cb]=undefined; }
      script.remove();
    }

    const timer=setTimeout(()=>{
      if(finished)return;
      finished=true;
      cleanup();
      reject(new Error("timeout"));
    },20000);

    window[cb]=data=>{
      if(finished)return;
      finished=true;
      cleanup();
      resolve(data);
    };

    script.async=true;
    script.onerror=()=>{
      if(finished)return;
      finished=true;
      cleanup();
      reject(new Error("network"));
    };

    // Google Apps Script Web Apps return a redirect before the final
    // googleusercontent response. A normal <script> request follows it.
    // Add a cache buster so an old redirected response is not reused.
    const sep=url.includes("?")?"&":"?";
    script.src=url+sep+
      "callback="+encodeURIComponent(cb)+
      "&_="+Date.now();

    document.head.appendChild(script);
  });
}

async function searchProduct(code){
  if(!validURL())return;

  code=String(code||"").trim();
  if(!code)return;

  currentCode=code;
  message("جاري البحث عن المنتوج…");
  $("product").classList.add("hidden");

  try{
    const url=
      APPS_SCRIPT_URL+
      "?action=lookup&code="+encodeURIComponent(code);

    const result=await jsonp(url);

    if(!result.ok){
      message(result.error||"حدث خطأ");
      return;
    }

    if(!result.found){
      message("الكود غير موجود في Google Sheets.");
      return;
    }

    $("name").textContent=result.name||"بدون اسم";
    $("shownCode").textContent=code;
    $("product").classList.remove("hidden");

    if(result.imageData){
      setImage(result.imageData);
      originalImage=result.imageData;
      $("drive").textContent="✓ توجد صورة محفوظة في Google Drive.";
    }else{
      showNoPhoto();
      $("drive").textContent="لا توجد صورة محفوظة لهذا الكود.";
    }

    message("تم العثور على المنتوج.");

  }catch(error){
    console.error("Apps Script lookup error:",error);
    message("تعذر الاتصال بـ Google Apps Script.");
    toast("تعذر قراءة نتيجة Apps Script. أعد المحاولة.");
  }
}

function showNoPhoto(){
  currentImage="";
  $("photo").classList.add("hidden");
  $("noPhoto").classList.remove("hidden");
  $("edit").classList.add("hidden");
}

function setImage(data){
  currentImage=data;
  rotation=0;
  $("photo").src=data;
  $("photo").style.transform="rotate(0deg)";
  $("photo").classList.remove("hidden");
  $("noPhoto").classList.add("hidden");
  $("edit").classList.remove("hidden");
}

function fileToDataURL(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

async function compressImage(data){
  const img=new Image();
  img.src=data;

  await new Promise((resolve,reject)=>{
    img.onload=resolve;
    img.onerror=reject;
  });

  const max=1600;
  const scale=Math.min(
    1,
    max/Math.max(img.naturalWidth,img.naturalHeight)
  );

  const canvas=document.createElement("canvas");
  canvas.width=Math.round(img.naturalWidth*scale);
  canvas.height=Math.round(img.naturalHeight*scale);

  canvas.getContext("2d").drawImage(
    img,0,0,canvas.width,canvas.height
  );

  return canvas.toDataURL("image/jpeg",.86);
}

async function makeFinalImage(){
  const img=new Image();
  img.src=currentImage;

  await new Promise((resolve,reject)=>{
    img.onload=resolve;
    img.onerror=reject;
  });

  const swap=rotation%180!==0;

  const canvas=document.createElement("canvas");
  canvas.width=swap?img.naturalHeight:img.naturalWidth;
  canvas.height=swap?img.naturalWidth:img.naturalHeight;

  const ctx=canvas.getContext("2d");

  ctx.translate(canvas.width/2,canvas.height/2);
  ctx.rotate(rotation*Math.PI/180);
  ctx.drawImage(
    img,
    -img.naturalWidth/2,
    -img.naturalHeight/2
  );

  return canvas.toDataURL("image/jpeg",.88);
}

/* البحث */
$("find").onclick=()=>{
  searchProduct($("code").value);
};

$("code").addEventListener("keydown",e=>{
  if(e.key==="Enter")searchProduct(e.target.value);
});

/* اختيار صورة */
$("choose").onclick=()=>{
  $("file").click();
};

$("file").onchange=async e=>{
  const file=e.target.files?.[0];
  if(!file)return;

  try{
    const data=await fileToDataURL(file);
    setImage(await compressImage(data));
    $("drive").textContent="الصورة الجديدة جاهزة للحفظ.";
  }catch{
    toast("تعذر قراءة الصورة");
  }
};

/* تدوير */
$("rotate").onclick=()=>{
  rotation=(rotation+90)%360;
  $("photo").style.transform=`rotate(${rotation}deg)`;
};

/* الأصل */
$("restore").onclick=()=>{
  if(originalImage){
    setImage(originalImage);
  }
};

/*
  الحفظ:
  Apps Script يستقبل POST.
  يتم استعمال form مخفي بدل fetch حتى نتجنب مشاكل CORS.
*/
$("save").onclick=async()=>{
  if(!validURL() || !currentCode || !currentImage)return;

  try{
    $("save").disabled=true;
    $("save").textContent="جاري الحفظ…";

    const finalImage=await makeFinalImage();

    const form=document.createElement("form");
    form.method="POST";
    form.action=APPS_SCRIPT_URL;
    form.target="hiddenUploadFrame";
    form.style.display="none";

    const action=document.createElement("input");
    action.name="action";
    action.value="upload";

    const code=document.createElement("input");
    code.name="code";
    code.value=currentCode;

    const image=document.createElement("textarea");
    image.name="imageData";
    image.value=finalImage;

    form.append(action,code,image);
    document.body.appendChild(form);

    form.submit();

    setTimeout(()=>{
      form.remove();
      originalImage=finalImage;
      currentImage=finalImage;
      $("drive").textContent="✓ تم إرسال الصورة إلى Google Drive.";
      toast("تم الحفظ");
    },1800);

  }catch(error){
    console.error(error);
    toast("تعذر تجهيز الصورة");
  }finally{
    setTimeout(()=>{
      $("save").disabled=false;
      $("save").textContent="☁️ حفظ في Drive";
    },1900);
  }
};

/* التصوير */
$("take").onclick=async()=>{
  try{
    cameraStream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:"environment"}},
      audio:false
    });

    $("cameraVideo").srcObject=cameraStream;
    $("camera").classList.remove("hidden");

  }catch(error){
    toast("اسمح للمتصفح باستعمال الكاميرا");
  }
};

function closeCamera(){
  if(cameraStream){
    cameraStream.getTracks().forEach(track=>track.stop());
    cameraStream=null;
  }
  $("camera").classList.add("hidden");
}

$("closeCamera").onclick=closeCamera;

$("shot").onclick=async()=>{
  const video=$("cameraVideo");
  const canvas=$("canvas");

  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;

  canvas.getContext("2d").drawImage(
    video,0,0,canvas.width,canvas.height
  );

  const data=canvas.toDataURL("image/jpeg",.9);

  setImage(await compressImage(data));

  closeCamera();

  $("drive").textContent="الصورة الجديدة جاهزة للحفظ.";
};

/* Scanner */
$("scan").onclick=async()=>{
  if(!navigator.mediaDevices?.getUserMedia){
    toast("الكاميرا غير متاحة في هذا المتصفح");
    return;
  }

  $("scanner").classList.remove("hidden");

  try{
    scanStream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:"environment"}},
      audio:false
    });

    $("scanVideo").srcObject=scanStream;
    await $("scanVideo").play();

    if(!("BarcodeDetector" in window)){
      $("scanMsg").textContent=
        "المسح غير مدعوم في هذا المتصفح. أدخل الكود يدوياً.";
      return;
    }

    const detector=new BarcodeDetector({
      formats:[
        "ean_13","ean_8",
        "upc_a","upc_e",
        "code_128","code_39","itf"
      ]
    });

    const detect=async()=>{
      if(!scanStream)return;

      try{
        const codes=await detector.detect($("scanVideo"));

        if(codes.length && codes[0].rawValue){
          const value=codes[0].rawValue;

          $("code").value=value;
          stopScanner();
          searchProduct(value);
          return;
        }
      }catch(error){}

      requestAnimationFrame(detect);
    };

    detect();

  }catch(error){
    stopScanner();
    toast("تعذر تشغيل الكاميرا");
  }
};

function stopScanner(){
  if(scanStream){
    scanStream.getTracks().forEach(track=>track.stop());
    scanStream=null;
  }

  $("scanVideo").srcObject=null;
  $("scanner").classList.add("hidden");
}

$("stopScan").onclick=stopScanner;

/*
  iframe مخفي لاستقبال نتيجة POST من Apps Script.
*/
const iframe=document.createElement("iframe");
iframe.name="hiddenUploadFrame";
iframe.style.display="none";
document.body.appendChild(iframe);
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(err => {
      console.warn("Service Worker:", err);
    });
  });
}
</script>

</body>
</html>
