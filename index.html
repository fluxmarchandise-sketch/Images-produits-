<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4a07b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png" type="image/png">
<title>Gestion Images Produits</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#f8fafc 0%,#eef2f6 100%);color:#17202a;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
 .app{max-width:1050px;margin:auto;padding:6px 10px;height:100dvh;display:flex;flex-direction:column;overflow:hidden;min-height:0}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 5px;flex:0 0 auto}
h1{margin:0;font-size:23px;font-weight:850;letter-spacing:-.5px}
header p{margin:0;color:#6b7280;font-size:13px}
.card{background:#fff;border-radius:18px;padding:8px;margin-bottom:5px;box-shadow:0 5px 24px #0000000d}
label{display:block;font-weight:800;margin-bottom:4px;font-size:14px;color:#374151}
.search{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
input{font:inherit;min-width:0;padding:9px 12px;border:1px solid #d9dee5;border-radius:14px;outline:0;background:#fafbfc;transition:.18s}input:focus{border-color:#f2a07d;box-shadow:0 0 0 3px rgba(242,160,125,.16);background:#fff}
button{font:inherit;font-weight:800;border:0;border-radius:14px;padding:9px 12px;cursor:pointer;transition:transform .12s,box-shadow .12s}button:active{transform:scale(.98)}
.primary{background:#f29a73;color:#25140d;box-shadow:0 5px 14px rgba(242,154,115,.22)}
.secondary{background:#eef0f2;color:#30353b}
.danger{background:#b83d3d;color:#fff}
.msg{min-height:18px;margin-top:5px;color:#777;font-size:14px}
.scanner{position:relative;background:#111;border-radius:18px;overflow:hidden;margin-top:12px}
.scanner video{display:block;width:100%;max-height:360px}
.guide{position:absolute;left:12%;right:12%;top:50%;border-top:2px solid #f2a07d;box-shadow:0 0 12px #f2a07d}
.scanner .danger{position:absolute;top:10px;right:10px}
.scan-msg{color:#fff;padding:9px;text-align:center}
.hidden{display:none!important}
.product-title small{color:#777;font-weight:800}
.product-title h2{font-size:18px;margin:2px 0;line-height:1.15;font-weight:850;letter-spacing:-.2px}
.product-title code{color:#777}
.photo-box{width:400px;height:400px;max-width:100%;aspect-ratio:1/1;min-height:0;margin:6px auto 0;border-radius:18px;background:#fff;border:1px solid #edf0f3;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 auto}
.photo-box img{width:100%;height:100%;max-height:none;object-fit:contain}
.no-photo{display:flex;flex-direction:column;align-items:center;gap:8px;color:#777;text-align:center;padding:25px}
.no-photo span{font-size:52px}
.buttons,.edit{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}
.buttons button,.edit button{flex:1;min-width:125px;padding:8px 10px}
.download-row{display:flex;margin-top:6px}
.download-row button{width:100%;padding:8px 10px}
.edit{border-top:1px solid #edf0f3;padding-top:5px}.edit button{min-width:100%;}
.hint{font-size:12px;color:#777;margin-top:4px}
.modal{position:fixed;inset:0;background:#000b;z-index:20;display:flex;align-items:center;justify-content:center;padding:12px}
.modal-card{background:#fff;border-radius:20px;padding:12px;width:min(720px,100%)}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.modal-head button{font-size:25px;padding:1px 10px;background:#eee}
.modal video{width:100%;max-height:72vh;background:#111;border-radius:15px}
.shot{display:block;width:72px;height:72px;border-radius:50%;margin:12px auto 2px;background:#f2a07d;border:7px solid #eee;font-size:0}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:12px 16px;border-radius:12px;opacity:0;transition:.2s;z-index:50;white-space:nowrap}
.toast.show{opacity:1}
@media(max-width:650px){
  .app{padding:7px 8px}
  .search{grid-template-columns:minmax(0,1fr) auto auto}
  .search input{grid-column:auto}
  h1{font-size:21px}
  .card{padding:10px;border-radius:16px}
  label{margin-bottom:5px;font-size:14px}
  input{padding:10px}
  button{padding:10px 11px}
  .photo-box{width:min(400px,100%,calc(100dvh - 405px));height:min(400px,100%,calc(100dvh - 405px));aspect-ratio:1/1}
  .product-title h2{font-size:17px;line-height:1.12}
  .buttons button,.edit button{min-width:0}
  .download-row{margin-top:4px}
  .download-row button{padding:7px 8px}
}

@media(max-width:650px) and (max-height:750px){
  h1{font-size:20px}
  .card{padding:8px;margin-bottom:4px}
  .photo-box{width:min(400px,100%,calc(100dvh - 365px));height:min(400px,100%,calc(100dvh - 365px));margin-top:4px}
  .buttons,.edit{margin-top:4px;gap:5px}
  .buttons button,.edit button{padding:7px 8px}
  .product-title h2{font-size:16px;line-height:1.08}
  .product-title code{font-size:13px}
  .hint{font-size:11px;margin-top:3px}
}

}
</style>
</head>

<body>
<div class="app">

<header>
  <div>
    <h1>Gestion Images Produits</h1>

  </div>
</header>

<section class="card">
  <label for="code">Code produit</label>

  <div class="search">
    <input id="code" inputmode="numeric" autocomplete="off" placeholder="Saisir ou scanner le code">
    <button id="scan" class="primary" type="button">📷 Scanner</button>
  </div>

  <div id="scanner" class="scanner hidden">
    <video id="scanVideo" playsinline></video>
    <div class="guide"></div>
    <button id="stopScan" class="danger">Arrêter</button>
    <div id="scanMsg" class="scan-msg">Dirigez la caméra vers le code-barres</div>
  </div>

  <div id="msg" class="msg"></div>
</section>

<section id="product" class="card hidden">

  <div class="product-title">
    <small>Nom du produit</small>
    <h2 id="name">—</h2>
    <code id="shownCode"></code>
  </div>

  <div class="photo-box">
    <img id="photo" class="hidden" alt="Image du produit">
    <div id="noPhoto" class="no-photo">
      <span>📦</span>
      <b>Aucune image pour le moment</b>
      <small>Vous pouvez prendre une photo ou choisir une image sur votre téléphone</small>
    </div>
  </div>

  <div class="buttons">
    <button id="take" class="primary">📷 Prendre une photo</button>
    <button id="choose" class="secondary">🖼️ Depuis le téléphone</button>
    <input id="file" type="file" accept="image/*" hidden>
  </div>
  <div class="download-row">
    <button id="download" class="secondary">⬇️ Télécharger l’image sur le téléphone</button>
  </div>

  <div id="edit" class="edit hidden">
    <button id="save" class="primary">☁️ Enregistrer dans Drive</button>
  </div>

  <div id="drive" class="hint"></div>
</section>

</div>

<div id="camera" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <b>Prendre une photo du produit</b>
      <button id="closeCamera">×</button>
    </div>
    <video id="cameraVideo" autoplay playsinline></video>
    <canvas id="canvas" hidden></canvas>
    <button id="shot" class="shot">●</button>
  </div>
</div>

<!--
  غيّر فقط هذا الرابط بعد إنشاء Google Apps Script Web App.
-->
<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyk67qh-UM5Cv1LrHvysWn4X0loEoRBpU-wVG7qS02c6KLb_gYv7wba3CJOf6MXX8O8/exec";
const APP_VERSION = "2026-09-11-v2";

let currentCode="";
let currentImage="";
let originalImage="";
let cameraStream=null;
let scanStream=null;

const $=id=>document.getElementById(id);

function toast(text){
  const e=$("toast") || document.createElement("div");
  if(!e.id){e.id="toast";e.className="toast";document.body.appendChild(e)}
  e.textContent=text;
  e.classList.add("show");
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>e.classList.remove("show"),2600);
}

function message(text){$("msg").textContent=text}

function validURL(){
  if(!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes("PUT_YOUR")){
    toast("Ajoutez d’abord le lien Google Apps Script dans le fichier");
    return false;
  }
  return true;
}

/*
  JSONP:
  نستخدمه للبحث حتى لا تكون هناك مشكلة CORS
  عند استدعاء Google Apps Script من PWA.
*/
function jsonp(url){
  return new Promise((resolve,reject)=>{
    const cb="productCallback_"+Date.now()+"_"+Math.random().toString(36).slice(2);
    const script=document.createElement("script");
    let finished=false;

    function cleanup(){
      clearTimeout(timer);
      try{ delete window[cb]; }catch(e){ window[cb]=undefined; }
      script.remove();
    }

    const timer=setTimeout(()=>{
      if(finished)return;
      finished=true;
      cleanup();
      reject(new Error("timeout"));
    },20000);

    window[cb]=data=>{
      if(finished)return;
      finished=true;
      cleanup();
      resolve(data);
    };

    script.async=true;
    script.onerror=()=>{
      if(finished)return;
      finished=true;
      cleanup();
      reject(new Error("network"));
    };

    // Google Apps Script Web Apps return a redirect before the final
    // googleusercontent response. A normal <script> request follows it.
    // Add a cache buster so an old redirected response is not reused.
    const sep=url.includes("?")?"&":"?";
    script.src=url+sep+
      "callback="+encodeURIComponent(cb)+
      "&_="+Date.now();

    document.head.appendChild(script);
  });
}

async function searchProduct(code, requestId){
  if(!validURL())return;

  code=String(code||"").trim();
  if(!code)return;

  if(requestId==null) requestId=++searchRequestId;
  if(requestId!==searchRequestId)return;

  currentCode=code;
  message("Recherche du produit…");
  $("product").classList.add("hidden");

  try{
    const url=
      APPS_SCRIPT_URL+
      "?action=lookup&code="+encodeURIComponent(code);

    const result=await jsonp(url);

    if(requestId!==searchRequestId)return;
    const latestCode=String($("code").value||"").replace(/\D/g,"").trim();
    if(latestCode!==code)return;

    if(!result.ok){
      message(result.error||"Une erreur est survenue");
      return;
    }

    if(!result.found){
      message("Code introuvable dans Google Sheets.");
      return;
    }

    const productName=result.name||"Sans nom";
    $("name").textContent=productName;
    $("shownCode").textContent=code;
    $("product").classList.remove("hidden");

    if(result.imageData){
      setImage(result.imageData);
      originalImage=result.imageData;
      $("drive").textContent="✓ Une image est enregistrée dans Google Drive.";
    }else{
      showNoPhoto();
      $("drive").textContent="Aucune image enregistrée pour ce code.";
    }

    message("Produit trouvé.");

  }catch(error){
    if(requestId!==searchRequestId)return;
    console.error("Apps Script lookup error:",error);
    message("Impossible de se connecter à Google Apps Script.");
    toast("Impossible de lire la réponse Apps Script. Réessayez.");
  }
}

function showNoPhoto(){
  currentImage="";
  $("photo").classList.add("hidden");
  $("noPhoto").classList.remove("hidden");
  $("edit").classList.add("hidden");
}

function setImage(data){
  currentImage=data;
  $("photo").src=data;
  $("photo").classList.remove("hidden");
  $("noPhoto").classList.add("hidden");
  $("edit").classList.remove("hidden");
}

function fileToDataURL(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

async function compressImage(data){
  const img=new Image();
  img.src=data;

  await new Promise((resolve,reject)=>{
    img.onload=resolve;
    img.onerror=reject;
  });

  const max=1600;
  const scale=Math.min(
    1,
    max/Math.max(img.naturalWidth,img.naturalHeight)
  );

  const canvas=document.createElement("canvas");
  canvas.width=Math.round(img.naturalWidth*scale);
  canvas.height=Math.round(img.naturalHeight*scale);

  canvas.getContext("2d").drawImage(
    img,0,0,canvas.width,canvas.height
  );

  return canvas.toDataURL("image/jpeg",.86);
}

async function makeFinalImage(){
  const img=new Image();
  img.src=currentImage;

  await new Promise((resolve,reject)=>{
    img.onload=resolve;
    img.onerror=reject;
  });

  // الصورة النهائية دائماً 400 × 400 بنسبة 1:1
  const SIZE=400;
  const canvas=document.createElement("canvas");
  canvas.width=SIZE;
  canvas.height=SIZE;

  const ctx=canvas.getContext("2d");

  // خلفية بيضاء بدون تشويه الصورة
  ctx.fillStyle="#fff";
  ctx.fillRect(0,0,SIZE,SIZE);

  // احتواء الصورة كاملة داخل مربع 400×400
  const scale=Math.min(
    SIZE/img.naturalWidth,
    SIZE/img.naturalHeight
  );
  const width=Math.round(img.naturalWidth*scale);
  const height=Math.round(img.naturalHeight*scale);
  const x=Math.round((SIZE-width)/2);
  const y=Math.round((SIZE-height)/2);

  ctx.drawImage(img,x,y,width,height);

  return canvas.toDataURL("image/jpeg",.90);
}

/* البحث */
let autoSearchTimer=null;
let lastAutoCode="";
let searchRequestId=0;

function startSearchForCode(value){
  value=String(value||"").replace(/\D/g,"").trim();
  if(!value || value.length<4)return;
  const requestId=++searchRequestId;
  clearTimeout(autoSearchTimer);
  autoSearchTimer=setTimeout(async()=>{
    const current=String($("code").value||"").replace(/\D/g,"").trim();
    if(current!==value)return;
    try{ await searchProduct(value,requestId); }catch(error){ console.error("Search error:",error); }
  },400);
}

$("code").addEventListener("input",e=>{
  const value=String(e.target.value||"").replace(/\D/g,"");
  e.target.value=value;
  clearTimeout(autoSearchTimer);
  if(value.length<4){ searchRequestId++; lastAutoCode=""; return; }
  startSearchForCode(value);
});

$("code").addEventListener("paste",()=>{
  setTimeout(()=>{
    const value=String($("code").value||"").replace(/\D/g,"");
    $("code").value=value;
    clearTimeout(autoSearchTimer);
    if(value.length<4){ searchRequestId++; lastAutoCode=""; return; }
    startSearchForCode(value);
  },0);
});

$("code").addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    e.preventDefault();
    clearTimeout(autoSearchTimer);
    const value=String(e.target.value||"").replace(/\D/g,"").trim();
    e.target.value=value;
    if(value.length>=4){
      lastAutoCode=value;
      const requestId=++searchRequestId;
      searchProduct(value,requestId);
    }
  }
});

/* اختيار صورة */
$("choose").onclick=()=>{
  $("file").click();
};

$("file").onchange=async e=>{
  const file=e.target.files?.[0];
  if(!file)return;

  try{
    const data=await fileToDataURL(file);
    setImage(await compressImage(data));
    $("drive").textContent="La nouvelle image est prête à être enregistrée.";
  }catch{
    toast("Impossible de lire l’image");
  }
};


/*
  الحفظ:
  Apps Script يستقبل POST.
  يتم إنشاء iframe جديد لكل عملية حفظ حتى لا تبقى
  عملية الحفظ الثانية مرتبطة بالـ iframe السابق.
*/
let saveInProgress=false;
let saveSequence=0;

$("save").onclick=async()=>{
  if(saveInProgress)return;
  if(!validURL() || !currentCode || !currentImage){
    toast("Ajoutez d’abord une image");
    return;
  }

  saveInProgress=true;
  const saveButton=$("save");
  const codeToSave=String(currentCode);
  const imageToSave=currentImage;

  saveButton.disabled=true;
  saveButton.textContent="Enregistrement…";

  let form=null;
  let uploadFrame=null;
  let finished=false;

  try{
    const finalImage=await makeFinalImage();

    // iframe مستقل لكل عملية: مهم جداً للحفظ المتكرر.
    const frameName="uploadFrame_"+Date.now()+"_"+(++saveSequence);
    uploadFrame=document.createElement("iframe");
    uploadFrame.name=frameName;
    uploadFrame.style.display="none";
    document.body.appendChild(uploadFrame);

    form=document.createElement("form");
    form.method="POST";
    form.action=APPS_SCRIPT_URL;
    form.target=frameName;
    form.style.display="none";

    const action=document.createElement("input");
    action.name="action";
    action.value="upload";

    const code=document.createElement("input");
    code.name="code";
    code.value=codeToSave;

    const image=document.createElement("textarea");
    image.name="imageData";
    image.value=finalImage;

    form.append(action,code,image);
    document.body.appendChild(form);

    const finishUpload=()=>{
      if(finished)return;
      finished=true;

      if(uploadFrame){
        uploadFrame.removeEventListener("load",finishUpload);
      }

      if(form)form.remove();
      if(uploadFrame)uploadFrame.remove();

      // نعتبر العملية منتهية بعد رجوع POST.
      originalImage=finalImage;
      currentImage=finalImage;
      $("drive").textContent="✓ Image enregistrée dans Google Drive.";
      toast("✓ Image enregistrée dans Google Drive");

      setTimeout(()=>{
        $("code").value="";
        $("product").classList.add("hidden");
        $("msg").textContent="";
        $("drive").textContent="";
        currentCode="";
        currentImage="";
        originalImage="";
        lastAutoCode="";
        $("photo").src="";
        $("photo").classList.add("hidden");
        $("noPhoto").classList.remove("hidden");
        $("edit").classList.add("hidden");
        $("file").value="";
        searchRequestId++;
      },900);
    };

    uploadFrame.addEventListener("load",finishUpload);
    form.submit();

    // احتياط للمتصفحات التي لا ترسل load مع رد Apps Script.
    setTimeout(()=>{
      if(!finished)finishUpload();
    },10000);

  }catch(error){
    console.error("Save error:",error);
    if(form)form.remove();
    if(uploadFrame)uploadFrame.remove();
    toast("تعذر حفظ الصورة");
  }finally{
    setTimeout(()=>{
      saveInProgress=false;
      saveButton.disabled=false;
      saveButton.textContent="☁️ Enregistrer dans Drive";
    },1100);
  }
};

/* تحميل الصورة إلى الهاتف */
$("download").onclick=()=>{
  if(!currentImage){
    toast("Aucune image à télécharger");
    return;
  }
  try{
    const link=document.createElement("a");
    link.href=currentImage;
    link.download=(currentCode||"image-produit")+".jpg";
    document.body.appendChild(link);
    link.click();
    link.remove();
    toast("✓ Image téléchargée sur le téléphone");
  }catch(error){
    console.error("Download error:",error);
    toast("Impossible de télécharger l’image");
  }
};

/* التصوير */
$("take").onclick=async()=>{
  try{
    cameraStream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:"environment"}},
      audio:false
    });

    $("cameraVideo").srcObject=cameraStream;
    $("camera").classList.remove("hidden");

  }catch(error){
    toast("Autorisez le navigateur à utiliser la caméra");
  }
};

function closeCamera(){
  if(cameraStream){
    cameraStream.getTracks().forEach(track=>track.stop());
    cameraStream=null;
  }
  $("camera").classList.add("hidden");
}

$("closeCamera").onclick=closeCamera;

$("shot").onclick=async()=>{
  const video=$("cameraVideo");
  const canvas=$("canvas");

  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;

  canvas.getContext("2d").drawImage(
    video,0,0,canvas.width,canvas.height
  );

  const data=canvas.toDataURL("image/jpeg",.9);

  setImage(await compressImage(data));

  closeCamera();

  $("drive").textContent="La nouvelle image est prête à être enregistrée.";
};

/* Scanner */
$("scan").onclick=async()=>{
  if(!navigator.mediaDevices?.getUserMedia){
    toast("La caméra n’est pas disponible dans ce navigateur");
    return;
  }

  $("scanner").classList.remove("hidden");

  try{
    scanStream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:"environment"}},
      audio:false
    });

    $("scanVideo").srcObject=scanStream;
    await $("scanVideo").play();

    if(!("BarcodeDetector" in window)){
      $("scanMsg").textContent=
        "Le scan n’est pas pris en charge par ce navigateur. Saisissez le code manuellement.";
      return;
    }

    const detector=new BarcodeDetector({
      formats:[
        "ean_13","ean_8",
        "upc_a","upc_e",
        "code_128","code_39","itf"
      ]
    });

    const detect=async()=>{
      if(!scanStream)return;

      try{
        const codes=await detector.detect($("scanVideo"));

        if(codes.length && codes[0].rawValue){
          const value=codes[0].rawValue;

          $("code").value=value;
          lastAutoCode=value;
          stopScanner();
          const requestId=++searchRequestId;
          searchProduct(value,requestId);
          return;
        }
      }catch(error){}

      requestAnimationFrame(detect);
    };

    detect();

  }catch(error){
    stopScanner();
    toast("Impossible de démarrer la caméra");
  }
};

function stopScanner(){
  if(scanStream){
    scanStream.getTracks().forEach(track=>track.stop());
    scanStream=null;
  }

  $("scanVideo").srcObject=null;
  $("scanner").classList.add("hidden");
}

$("stopScan").onclick=stopScanner;

</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(err => {
      console.warn("Service Worker:", err);
    });
  });
}
</script>

</body>
</html>
